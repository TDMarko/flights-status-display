; Flydar — realtime flight radar for the LilyGO T-Display-S3 (ESP32-S3).
; Build & flash:  pio run -e flydar -t upload
; Serial monitor: pio device monitor -b 115200
; Host tests:     pio test -e native

[platformio]
default_envs = flydar
boards_dir = ./boards
src_dir = src

[env:flydar]
platform = espressif32@6.5.0
board = lilygo-t-displays3
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over the USB-C port
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    bblanchon/ArduinoJson@^7
    moononournation/GFX Library for Arduino@1.4.2   ; 1.4.2 = last release compatible with esp32 core in platform 6.5.0

; Host build for the Arduino-free logic (geo maths, ADS-B parsing).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<geo.cpp> +<adsb.cpp> +<trails.cpp>
build_flags =
    -std=gnu++17
    -DFLYDAR_HOST_BUILD
    -DFIXTURE_DIR=\"$PROJECT_DIR/test/fixtures\"
lib_deps =
    bblanchon/ArduinoJson@^7
